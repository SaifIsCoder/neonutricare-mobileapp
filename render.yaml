services:
  - type: web
    name: neonutricare-prediction-api
    runtime: python
    plan: free
    rootDir: prediction-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
